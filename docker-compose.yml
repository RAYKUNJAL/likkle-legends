# Likkle Legends — self-hosted stack (VPS)
# Open-source tooling only: Docker, Caddy (auto-HTTPS), Alpine cron.
# See deploy/README.md for the full runbook.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://www.likklelegends.com}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-www.likklelegends.com}
      SITE_DOMAIN_ALT: ${SITE_DOMAIN_ALT:-likklelegends.com}
    depends_on:
      - web

  # Replaces Vercel Cron: fires the app's /api/cron/* routes on schedule.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./deploy/crontab:/etc/crontabs/root:ro
    command: ["crond", "-f", "-l", "6"]
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
